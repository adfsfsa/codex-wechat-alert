name: Codex WeChat Alert

on:
  push:
    branches: [main]
    paths:
      - monitor.py
      - config.json
      - tests/**
      - .github/workflows/monitor.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = 正式检查；test-push = 微信测试；dry-run = 只读检查'
        type: choice
        default: dry-run
        options:
          - dry-run
          - test-push
          - check

permissions:
  contents: write

concurrency:
  group: codex-wechat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'schedule' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify monitor behavior
        run: python -m unittest discover -s tests -v
      - name: Read official sources / notify WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'check' || 'dry-run') }}
        shell: bash
        run: |
          case "$MODE" in
            dry-run) python monitor.py --dry-run ;;
            test-push) python monitor.py --test-push ;;
            check) python monitor.py ;;
            *) exit 1 ;;
          esac
      - name: Persist state even when a source or delivery fails
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'dry-run'))
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [ ! -f data/state.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record announcement monitor state [skip ci]'
          git push origin "HEAD:$DEFAULT_BRANCH"
